<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensei's Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #16233f;
    --navy-2: #1e2f52;
    --blue-accent: #3d8bfd;
    --blue-accent-dark: #2a6fd6;
    --bg-soft: #eef2f7;
    --panel-white: #ffffff;
    --pill-bg: #f3f5f8;
    --pill-border: #e2e6ee;
    --yellow: #ffd23f;
    --yellow-dark: #f5a623;
    --gold-text: #c9962c;
    --green-ap: #38c76a;
    --gem-blue: #4aa8ff;
    --pink-badge: #ff5fa2;
    --pink-badge-bg: #ffe1ee;
    --orange-tag: #ff8a3d;
    --orange-tag-bg: #fff0e2;
    --daily-tag: #3d8bfd;
    --daily-tag-bg: #e4f0ff;
    --weekly-tag: #7c5cff;
    --weekly-tag-bg: #ece5ff;
    --custom-tag: #2bb3a3;
    --custom-tag-bg: #e0f7f3;
    --text-dark: #1c2740;
    --text-mid: #5b6478;
    --text-soft: #8891a3;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-card: 0 4px 14px rgba(20,30,60,0.08), 0 1px 3px rgba(20,30,60,0.06);
    --shadow-pop: 0 10px 30px rgba(20,30,60,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:'Nunito',sans-serif;
    background:#0c1220;
    color:var(--text-dark);
    -webkit-font-smoothing:antialiased;
  }
  .app-shell{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
  }
  .view{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
  }
  .view.active{display:flex;}

  /* ---------- HOME VIEW ---------- */
  #homeView{background:#0c1220;}
  .wallpaper-layer{
    position:absolute;
    inset:0;
    background:#0c1220;
  }
  .wallpaper-layer img, .wallpaper-layer video{
    width:100%;height:100%;object-fit:cover;
    display:block;
  }
  .wallpaper-empty{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#7a8bb0;gap:10px;text-align:center;padding:24px;
  }
  .wallpaper-empty svg{opacity:.5;width:48px;height:48px;}
  .wallpaper-empty b{font-family:'Baloo 2';color:#cfd9ee;font-size:16px;}

  .home-topbar{
    position:relative;z-index:5;
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 0 16px;
    flex-wrap:wrap;
  }
  .stat-pill{
    background:rgba(255,255,255,0.94);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:999px;
    padding:7px 12px;
    display:flex;align-items:center;gap:6px;
    font-family:'Baloo 2';font-weight:700;font-size:14px;
    color:var(--text-dark);
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
  }
  .stat-pill .ico{width:16px;height:16px;flex-shrink:0;}
  .stat-pill.ap .ico{color:var(--green-ap);}
  .stat-pill.gold .ico{color:var(--gold-text);}
  .stat-pill.gem .ico{color:var(--gem-blue);}
  .spacer{flex:1;}
  .icon-btn{
    width:36px;height:36px;border-radius:999px;
    background:rgba(255,255,255,0.94);
    border:1px solid rgba(255,255,255,0.6);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.15);
    color:var(--navy);
  }
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn:active{transform:scale(0.94);}

  .wallpaper-side-controls{
    position:absolute;top:50%;transform:translateY(-50%);
    z-index:5;
    width:40px;height:40px;border-radius:999px;
    background:rgba(12,18,32,0.45);
    display:flex;align-items:center;justify-content:center;
    color:#fff;cursor:pointer;
  }
  .wallpaper-side-controls.left{left:14px;}
  .wallpaper-side-controls.right{right:14px;}
  .wallpaper-side-controls svg{width:20px;height:20px;}
  .wallpaper-side-controls:hover{background:rgba(12,18,32,0.65);}

  .home-bottombar{
    position:relative;z-index:5;margin-top:auto;
    background:linear-gradient(180deg, rgba(238,242,247,0) 0%, rgba(238,242,247,0.97) 30%, #eef2f7 100%);
    padding:26px 14px 14px 14px;
    display:flex;align-items:flex-end;gap:8px;justify-content:center;
  }
  .nav-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    cursor:pointer;min-width:58px;position:relative;
    padding:6px 6px 4px;border-radius:12px;
  }
  .nav-btn .nav-icon-box{
    width:42px;height:42px;border-radius:12px;
    background:var(--panel-white);
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-card);
    color:var(--navy);
  }
  .nav-btn.active .nav-icon-box{background:var(--navy);color:#fff;}
  .nav-btn .nav-icon-box svg{width:22px;height:22px;}
  .nav-btn span{font-family:'Baloo 2';font-weight:700;font-size:11.5px;color:var(--text-mid);}
  .nav-btn.active span{color:var(--navy);}
  .nav-btn .badge-dot{
    position:absolute;top:2px;right:6px;width:8px;height:8px;border-radius:50%;
    background:#ff4d5e;border:1.5px solid #fff;
  }

  /* ---------- TASKS VIEW ---------- */
  #tasksView{background:var(--bg-soft);}
  .tasks-header{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;background:var(--panel-white);
    box-shadow:0 2px 8px rgba(20,30,60,0.06);
    z-index:3;
  }
  .back-circle{
    width:38px;height:38px;border-radius:50%;
    background:var(--pill-bg);border:1px solid var(--pill-border);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);
  }
  .back-circle svg{width:18px;height:18px;}
  .tasks-header h1{
    font-family:'Baloo 2';font-size:22px;margin:0;color:var(--text-dark);font-weight:800;
  }
  .tasks-header .spacer{flex:1;}
  .tasks-header .stat-pill{background:var(--pill-bg);border:1px solid var(--pill-border);box-shadow:none;}

  .tasks-body{
    flex:1;display:flex;overflow:hidden;
  }
  .character-panel{
    width:280px;flex-shrink:0;
    background:linear-gradient(180deg,#dbeafe 0%,#eef2f7 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    position:relative;padding:18px 16px 20px;
    border-right:1px solid #e2e6ee;
  }
  .character-panel .char-img-wrap{
    flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;
    cursor:pointer;min-height:0;
  }
  .character-panel img.char-img{
    max-width:100%;max-height:100%;object-fit:contain;
    filter:drop-shadow(0 10px 12px rgba(20,30,60,0.18));
  }
  .char-empty{
    color:#7d8bab;text-align:center;font-family:'Baloo 2';font-size:14px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .char-empty svg{width:40px;height:40px;opacity:.55;}
  .speech-bubble{
    background:#fff;border-radius:16px;padding:12px 14px;
    box-shadow:var(--shadow-card);font-size:13.5px;line-height:1.4;
    color:var(--text-dark);position:relative;margin-bottom:12px;width:100%;
    min-height:20px;
  }
  .speech-bubble:after{
    content:"";position:absolute;bottom:-8px;left:28px;
    border-width:8px 8px 0 8px;border-style:solid;
    border-color:#fff transparent transparent transparent;
  }
  .char-manage-btn{
    font-family:'Baloo 2';font-weight:700;font-size:12.5px;
    background:var(--panel-white);border:1px solid var(--pill-border);
    border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--navy);
    box-shadow:var(--shadow-card);
  }

  .tasks-panel{
    flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px 18px 0;
  }
  .category-tabs{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;flex-shrink:0;
  }
  .cat-tab{
    font-family:'Baloo 2';font-weight:700;font-size:14px;
    padding:9px 16px;border-radius:12px;cursor:pointer;white-space:nowrap;
    background:var(--panel-white);color:var(--text-mid);border:1px solid var(--pill-border);
    position:relative;
  }
  .cat-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .cat-tab .dot{
    position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#ff4d5e;
  }
  .cat-tab.add-tab{color:var(--blue-accent-dark);border-style:dashed;}

  .task-list{
    flex:1;overflow-y:auto;padding-bottom:14px;display:flex;flex-direction:column;gap:10px;
  }
  .task-card{
    background:var(--panel-white);border-radius:var(--radius-md);
    box-shadow:var(--shadow-card);padding:14px 16px;
    display:flex;flex-direction:column;gap:8px;
  }
  .task-card.claimed{opacity:0.55;}
  .task-top{display:flex;align-items:center;gap:10px;}
  .task-tag{
    font-family:'Baloo 2';font-weight:700;font-size:11.5px;
    padding:3px 10px;border-radius:8px;flex-shrink:0;
  }
  .task-tag.tag-daily{background:var(--daily-tag-bg);color:var(--daily-tag);}
  .task-tag.tag-weekly{background:var(--weekly-tag-bg);color:var(--weekly-tag);}
  .task-tag.tag-achievement{background:var(--orange-tag-bg);color:var(--orange-tag);}
  .task-tag.tag-custom{background:var(--custom-tag-bg);color:var(--custom-tag);}
  .task-title{font-family:'Baloo 2';font-weight:700;font-size:15px;color:var(--text-dark);flex:1;}
  .task-del{
    width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--text-soft);cursor:pointer;flex-shrink:0;
  }
  .task-del:hover{background:#fbe3e6;color:#e0455a;}
  .task-del svg{width:13px;height:13px;}
  .task-bottom{display:flex;align-items:center;gap:12px;}
  .progress-track{
    flex:1;height:9px;border-radius:999px;background:#e5e9f1;overflow:hidden;
  }
  .progress-fill{height:100%;background:linear-gradient(90deg,#5aa3ff,#3d8bfd);border-radius:999px;transition:width .25s ease;}
  .progress-count{font-family:'Baloo 2';font-weight:700;font-size:12.5px;color:var(--text-mid);flex-shrink:0;}
  .task-action-btn{
    font-family:'Baloo 2';font-weight:800;font-size:13px;
    border:none;border-radius:10px;padding:8px 16px;cursor:pointer;flex-shrink:0;
  }
  .task-action-btn.progress{background:var(--blue-accent);color:#fff;}
  .task-action-btn.claim{background:linear-gradient(180deg,#ffe27a,var(--yellow-dark));color:#6b4200;}
  .task-action-btn.claimed{background:#e5e9f1;color:var(--text-soft);cursor:default;}
  .task-reward{
    display:flex;align-items:center;gap:4px;font-family:'Baloo 2';font-weight:700;font-size:12.5px;color:var(--gold-text);
  }
  .task-reward svg{width:14px;height:14px;}

  .empty-state{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--text-soft);gap:8px;text-align:center;padding:30px;
  }
  .empty-state svg{width:44px;height:44px;opacity:.4;}
  .empty-state b{font-family:'Baloo 2';color:var(--text-mid);font-size:15px;}

  .fab-add{
    position:absolute;bottom:20px;right:20px;
    background:linear-gradient(180deg,#4fa0ff,var(--blue-accent-dark));
    color:#fff;border:none;border-radius:16px;
    padding:13px 20px;font-family:'Baloo 2';font-weight:800;font-size:14.5px;
    display:flex;align-items:center;gap:8px;cursor:pointer;
    box-shadow:0 8px 20px rgba(61,139,253,0.4);
  }
  .fab-add svg{width:18px;height:18px;}

  /* ---------- MODALS ---------- */
  .modal-overlay{
    position:absolute;inset:0;background:rgba(12,18,32,0.5);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay.active{display:flex;}
  .modal-box{
    background:#fff;border-radius:var(--radius-lg);padding:22px;
    width:100%;max-width:420px;max-height:88vh;overflow-y:auto;
    box-shadow:var(--shadow-pop);
  }
  .modal-box h2{
    font-family:'Baloo 2';font-size:19px;margin:0 0 16px;color:var(--text-dark);font-weight:800;
  }
  .field{margin-bottom:14px;}
  .field label{
    font-family:'Baloo 2';font-weight:700;font-size:12.5px;color:var(--text-mid);
    display:block;margin-bottom:6px;
  }
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--pill-border);
    font-family:'Nunito';font-size:14px;background:var(--pill-bg);color:var(--text-dark);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{
    font-family:'Baloo 2';font-weight:800;font-size:14px;border:none;border-radius:12px;
    padding:11px 16px;cursor:pointer;flex:1;text-align:center;
  }
  .btn.primary{background:linear-gradient(180deg,#4fa0ff,var(--blue-accent-dark));color:#fff;}
  .btn.secondary{background:var(--pill-bg);color:var(--text-mid);border:1.5px solid var(--pill-border);}
  .btn.danger{background:#fdeceb;color:#d9445c;}

  .thumb-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .thumb{
    width:64px;height:64px;border-radius:10px;overflow:hidden;position:relative;
    border:1.5px solid var(--pill-border);flex-shrink:0;
  }
  .thumb img, .thumb video{width:100%;height:100%;object-fit:cover;}
  .thumb .rm{
    position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,0.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .thumb .rm svg{width:10px;height:10px;}
  .upload-tile{
    width:64px;height:64px;border-radius:10px;border:1.5px dashed var(--pill-border);
    display:flex;align-items:center;justify-content:center;color:var(--text-soft);cursor:pointer;flex-shrink:0;
  }
  .upload-tile svg{width:22px;height:22px;}

  .dialogue-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:180px;overflow-y:auto;}
  .dialogue-row{
    display:flex;align-items:center;gap:8px;background:var(--pill-bg);border-radius:10px;padding:8px 10px;
  }
  .dialogue-row span{flex:1;font-size:13px;color:var(--text-dark);}
  .dialogue-row .rm{cursor:pointer;color:var(--text-soft);flex-shrink:0;}
  .dialogue-row .rm svg{width:14px;height:14px;}

  .toast{
    position:absolute;bottom:24px;left:50%;transform:translateX(-50%) translateY(0);
    background:var(--navy);color:#fff;font-family:'Baloo 2';font-weight:700;font-size:13.5px;
    padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-pop);z-index:80;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .toast svg{width:16px;height:16px;color:var(--yellow);}

  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#c7cfdd;border-radius:99px;}
</style>
</head>
<body>
<div class="app-shell" id="appShell">

  <!-- ===== HOME VIEW ===== -->
  <div class="view active" id="homeView">
    <div class="wallpaper-layer" id="wallpaperLayer">
      <div class="wallpaper-empty" id="wallpaperEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-9 9"/></svg>
        <b>No wallpapers yet</b>
        <span style="font-size:13px;">Tap + below to add background images</span>
      </div>
    </div>

    <div class="wallpaper-side-controls left" id="wpPrev" title="Previous wallpaper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div class="wallpaper-side-controls right" id="wpNext" title="Next wallpaper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <div class="home-topbar">
      <div class="stat-pill gem">
        <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>
        <span id="currencyDisplay">0</span>
      </div>
      <div class="spacer"></div>
      <div class="icon-btn" id="wpShuffleBtn" title="Random wallpaper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      </div>
      <div class="icon-btn" id="wpUploadBtnHome" title="Add wallpapers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="icon-btn" id="wpManageBtn" title="Manage wallpapers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </div>
    </div>

    <div class="home-bottombar">
      <div class="nav-btn active" data-view="homeView">
        <div class="nav-icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></div>
        <span>Home</span>
      </div>
      <div class="nav-btn" data-view="tasksView" id="navTasksBtn">
        <div class="nav-icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></div>
        <span>Tasks</span>
        <div class="badge-dot" id="tasksBadge" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- ===== TASKS VIEW ===== -->
  <div class="view" id="tasksView">
    <div class="tasks-header">
      <div class="back-circle" id="backToHome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
      <h1>Tasks</h1>
      <div class="spacer"></div>
      <div class="stat-pill gem">
        <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>
        <span id="currencyDisplay2">0</span>
      </div>
    </div>
    <div class="tasks-body">
      <div class="character-panel">
        <div class="char-img-wrap" id="charImgWrap">
          <div class="char-empty" id="charEmpty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
            <span>Tap to add a character</span>
          </div>
        </div>
        <div class="speech-bubble" id="speechBubble" style="display:none;"></div>
        <button class="char-manage-btn" id="charManageBtn">Manage character</button>
      </div>
      <div class="tasks-panel">
        <div class="category-tabs" id="categoryTabs"></div>
        <div class="task-list" id="taskList"></div>
      </div>
    </div>
    <button class="fab-add" id="addTaskFab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      Add Task
    </button>
  </div>

  <!-- ===== MODAL: manage wallpapers ===== -->
  <div class="modal-overlay" id="wallpaperModal">
    <div class="modal-box">
      <h2>Wallpapers</h2>
      <div class="thumb-grid" id="wallpaperThumbGrid"></div>
      <input type="file" id="wallpaperFileInput" accept="image/*,video/*" multiple style="display:none;">
      <div class="modal-actions">
        <button class="btn secondary" id="closeWallpaperModal">Close</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: manage character ===== -->
  <div class="modal-overlay" id="charModal">
    <div class="modal-box">
      <h2>Character</h2>
      <div class="field">
        <label>Character image</label>
        <div class="thumb-grid" id="charThumbGrid"></div>
        <input type="file" id="charFileInput" accept="image/*" style="display:none;">
      </div>
      <div class="field">
        <label>Name (optional)</label>
        <input type="text" id="charNameInput" placeholder="e.g. Hoshino">
      </div>
      <div class="field">
        <label>Dialogue lines</label>
        <div class="dialogue-list" id="dialogueList"></div>
        <div class="field-row">
          <input type="text" id="newDialogueInput" placeholder="Type a line and press Add...">
          <button class="btn primary" style="flex:0 0 auto;padding:10px 16px;" id="addDialogueBtn">Add</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="closeCharModal">Done</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: add/edit task ===== -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
      <h2 id="taskModalTitle">Add Task</h2>
      <div class="field">
        <label>Task name</label>
        <input type="text" id="taskTitleInput" placeholder="e.g. Finish math homework">
      </div>
      <div class="field">
        <label>Category</label>
        <select id="taskCategorySelect"></select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Target count</label>
          <input type="number" id="taskTargetInput" min="1" value="1">
        </div>
        <div class="field">
          <label>Reward amount</label>
          <input type="number" id="taskRewardInput" min="0" value="10">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cancelTaskBtn">Cancel</button>
        <button class="btn primary" id="saveTaskBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: new category ===== -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal-box">
      <h2>New Category</h2>
      <div class="field">
        <label>Category name</label>
        <input type="text" id="newCategoryInput" placeholder="e.g. Reading">
      </div>
      <div class="field">
        <label>Tag color</label>
        <select id="newCategoryColor">
          <option value="daily">Blue</option>
          <option value="weekly">Purple</option>
          <option value="achievement">Orange</option>
          <option value="custom">Teal</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cancelCategoryBtn">Cancel</button>
        <button class="btn primary" id="saveCategoryBtn">Add</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>
    <span id="toastText"></span>
  </div>

</div>

<script>
/* ============================================================
   IndexedDB helper
============================================================ */
const DB_NAME = 'senseisDeskDB';
const DB_VERSION = 1;
let db;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('wallpapers')) d.createObjectStore('wallpapers', {keyPath:'id'});
      if(!d.objectStoreNames.contains('tasks')) d.createObjectStore('tasks', {keyPath:'id'});
      if(!d.objectStoreNames.contains('categories')) d.createObjectStore('categories', {keyPath:'id'});
      if(!d.objectStoreNames.contains('dialogues')) d.createObjectStore('dialogues', {keyPath:'id'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath:'key'});
    };
    req.onsuccess = (e)=>{ db = e.target.result; resolve(db); };
    req.onerror = (e)=> reject(e);
  });
}
function tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function dbGetAll(store){
  return new Promise((resolve,reject)=>{
    const req = tx(store).getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = reject;
  });
}
function dbGet(store, key){
  return new Promise((resolve,reject)=>{
    const req = tx(store).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = reject;
  });
}
function dbPut(store, val){
  return new Promise((resolve,reject)=>{
    const req = tx(store,'readwrite').put(val);
    req.onsuccess = ()=> resolve(val);
    req.onerror = reject;
  });
}
function dbDelete(store, key){
  return new Promise((resolve,reject)=>{
    const req = tx(store,'readwrite').delete(key);
    req.onsuccess = ()=> resolve();
    req.onerror = reject;
  });
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================================================
   State
============================================================ */
let state = {
  wallpapers: [],
  wallpaperIndex: 0,
  currency: 0,
  categories: [],
  activeCategory: 'all',
  tasks: [],
  character: null, // {id, imageDataURL, name}
  dialogues: [],
};

const DEFAULT_CATEGORIES = [
  {id:'daily', name:'Daily', color:'daily'},
  {id:'weekly', name:'Weekly', color:'weekly'},
  {id:'achievement', name:'Achievement', color:'achievement'},
];

/* ============================================================
   Boot
============================================================ */
async function boot(){
  await openDB();
  state.wallpapers = await dbGetAll('wallpapers');
  state.tasks = await dbGetAll('tasks');
  state.dialogues = await dbGetAll('dialogues');
  state.categories = await dbGetAll('categories');
  if(state.categories.length === 0){
    for(const c of DEFAULT_CATEGORIES){ await dbPut('categories', c); }
    state.categories = DEFAULT_CATEGORIES.slice();
  }
  const charRow = await dbGet('meta', 'character');
  state.character = charRow ? charRow.value : null;
  const curRow = await dbGet('meta', 'currency');
  state.currency = curRow ? curRow.value : 0;

  renderWallpaper();
  renderCurrency();
  renderCharacter();
  renderCategoryTabs();
  renderTasks();
  populateCategorySelect();
}

/* ============================================================
   Toast
============================================================ */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
}

/* ============================================================
   Navigation
============================================================ */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchView(btn.dataset.view));
});
document.getElementById('backToHome').addEventListener('click', ()=> switchView('homeView'));
function switchView(id){
  document.querySelectorAll('.view').forEach(v=> v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=> b.classList.toggle('active', b.dataset.view === id));
}

/* ============================================================
   Currency
============================================================ */
function renderCurrency(){
  document.getElementById('currencyDisplay').textContent = state.currency.toLocaleString();
  document.getElementById('currencyDisplay2').textContent = state.currency.toLocaleString();
}
async function addCurrency(amount){
  state.currency += amount;
  await dbPut('meta', {key:'currency', value: state.currency});
  renderCurrency();
}

/* ============================================================
   Wallpapers
============================================================ */
function renderWallpaper(){
  const layer = document.getElementById('wallpaperLayer');
  const empty = document.getElementById('wallpaperEmpty');
  layer.innerHTML = '';
  if(state.wallpapers.length === 0){
    layer.appendChild(empty);
    return;
  }
  if(state.wallpaperIndex >= state.wallpapers.length) state.wallpaperIndex = 0;
  const wp = state.wallpapers[state.wallpaperIndex];
  const el = wp.type.startsWith('video') ? document.createElement('video') : document.createElement('img');
  el.src = wp.dataURL;
  if(wp.type.startsWith('video')){ el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true; }
  layer.appendChild(el);
}
document.getElementById('wpPrev').addEventListener('click', ()=>{
  if(state.wallpapers.length === 0) return;
  state.wallpaperIndex = (state.wallpaperIndex - 1 + state.wallpapers.length) % state.wallpapers.length;
  renderWallpaper();
});
document.getElementById('wpNext').addEventListener('click', ()=>{
  if(state.wallpapers.length === 0) return;
  state.wallpaperIndex = (state.wallpaperIndex + 1) % state.wallpapers.length;
  renderWallpaper();
});
document.getElementById('wpShuffleBtn').addEventListener('click', ()=>{
  if(state.wallpapers.length < 2) return;
  let next;
  do{ next = Math.floor(Math.random()*state.wallpapers.length); }while(next === state.wallpaperIndex);
  state.wallpaperIndex = next;
  renderWallpaper();
});
document.getElementById('wpUploadBtnHome').addEventListener('click', ()=> document.getElementById('wallpaperFileInput').click());
document.getElementById('wpManageBtn').addEventListener('click', ()=>{
  renderWallpaperThumbs();
  document.getElementById('wallpaperModal').classList.add('active');
});
document.getElementById('closeWallpaperModal').addEventListener('click', ()=>{
  document.getElementById('wallpaperModal').classList.remove('active');
});
document.getElementById('wallpaperFileInput').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files || []);
  for(const f of files){
    const dataURL = await fileToDataURL(f);
    const row = {id: uid(), dataURL, type: f.type};
    await dbPut('wallpapers', row);
    state.wallpapers.push(row);
  }
  e.target.value = '';
  renderWallpaper();
  if(document.getElementById('wallpaperModal').classList.contains('active')) renderWallpaperThumbs();
  showToast(`Added ${files.length} wallpaper${files.length===1?'':'s'}`);
});
function renderWallpaperThumbs(){
  const grid = document.getElementById('wallpaperThumbGrid');
  grid.innerHTML = '';
  state.wallpapers.forEach(wp=>{
    const t = document.createElement('div');
    t.className = 'thumb';
    const el = wp.type.startsWith('video') ? document.createElement('video') : document.createElement('img');
    el.src = wp.dataURL;
    if(wp.type.startsWith('video')){ el.muted = true; }
    t.appendChild(el);
    const rm = document.createElement('div');
    rm.className = 'rm';
    rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    rm.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      await dbDelete('wallpapers', wp.id);
      state.wallpapers = state.wallpapers.filter(w=> w.id !== wp.id);
      renderWallpaperThumbs();
      renderWallpaper();
    });
    t.appendChild(rm);
    grid.appendChild(t);
  });
  const upload = document.createElement('div');
  upload.className = 'upload-tile';
  upload.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>';
  upload.addEventListener('click', ()=> document.getElementById('wallpaperFileInput').click());
  grid.appendChild(upload);
}

/* ============================================================
   Character + dialogue
============================================================ */
function renderCharacter(){
  const wrap = document.getElementById('charImgWrap');
  wrap.innerHTML = '';
  if(state.character && state.character.imageDataURL){
    const img = document.createElement('img');
    img.className = 'char-img';
    img.src = state.character.imageDataURL;
    wrap.appendChild(img);
  } else {
    wrap.innerHTML = `<div class="char-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
      <span>Tap to add a character</span>
    </div>`;
  }
  const bubble = document.getElementById('speechBubble');
  if(state.dialogues.length){
    bubble.style.display = 'block';
    sayRandomLine();
  } else {
    bubble.style.display = 'none';
  }
}
function sayRandomLine(){
  if(!state.dialogues.length) return;
  const line = state.dialogues[Math.floor(Math.random()*state.dialogues.length)];
  document.getElementById('speechBubble').textContent = line.text;
}
document.getElementById('charImgWrap').addEventListener('click', ()=>{
  if(state.character && state.character.imageDataURL){ sayRandomLine(); }
  else { openCharModal(); }
});
document.getElementById('charManageBtn').addEventListener('click', openCharModal);
document.getElementById('closeCharModal').addEventListener('click', async ()=>{
  const name = document.getElementById('charNameInput').value.trim();
  if(state.character){
    state.character.name = name;
    await dbPut('meta', {key:'character', value: state.character});
  }
  document.getElementById('charModal').classList.remove('active');
  renderCharacter();
});
function openCharModal(){
  document.getElementById('charNameInput').value = state.character?.name || '';
  renderCharThumb();
  renderDialogueList();
  document.getElementById('charModal').classList.add('active');
}
function renderCharThumb(){
  const grid = document.getElementById('charThumbGrid');
  grid.innerHTML = '';
  if(state.character && state.character.imageDataURL){
    const t = document.createElement('div');
    t.className = 'thumb';
    const img = document.createElement('img');
    img.src = state.character.imageDataURL;
    t.appendChild(img);
    const rm = document.createElement('div');
    rm.className = 'rm';
    rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    rm.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      state.character = null;
      await dbPut('meta', {key:'character', value: null});
      renderCharThumb();
      renderCharacter();
    });
    t.appendChild(rm);
    grid.appendChild(t);
  }
  const upload = document.createElement('div');
  upload.className = 'upload-tile';
  upload.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>';
  upload.addEventListener('click', ()=> document.getElementById('charFileInput').click());
  grid.appendChild(upload);
}
document.getElementById('charFileInput').addEventListener('change', async (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const dataURL = await fileToDataURL(f);
  state.character = {id:'main', imageDataURL: dataURL, name: state.character?.name || ''};
  await dbPut('meta', {key:'character', value: state.character});
  e.target.value = '';
  renderCharThumb();
  renderCharacter();
});
function renderDialogueList(){
  const list = document.getElementById('dialogueList');
  list.innerHTML = '';
  state.dialogues.forEach(d=>{
    const row = document.createElement('div');
    row.className = 'dialogue-row';
    const span = document.createElement('span');
    span.textContent = d.text;
    row.appendChild(span);
    const rm = document.createElement('div');
    rm.className = 'rm';
    rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    rm.addEventListener('click', async ()=>{
      await dbDelete('dialogues', d.id);
      state.dialogues = state.dialogues.filter(x=> x.id !== d.id);
      renderDialogueList();
      renderCharacter();
    });
    row.appendChild(rm);
    list.appendChild(row);
  });
}
document.getElementById('addDialogueBtn').addEventListener('click', addDialogueLine);
document.getElementById('newDialogueInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') addDialogueLine(); });
async function addDialogueLine(){
  const input = document.getElementById('newDialogueInput');
  const text = input.value.trim();
  if(!text) return;
  const row = {id: uid(), text};
  await dbPut('dialogues', row);
  state.dialogues.push(row);
  input.value = '';
  renderDialogueList();
  renderCharacter();
}

/* ============================================================
   Categories
============================================================ */
function renderCategoryTabs(){
  const wrap = document.getElementById('categoryTabs');
  wrap.innerHTML = '';
  const allTab = document.createElement('div');
  allTab.className = 'cat-tab' + (state.activeCategory === 'all' ? ' active' : '');
  allTab.textContent = 'All';
  allTab.addEventListener('click', ()=>{ state.activeCategory = 'all'; renderCategoryTabs(); renderTasks(); });
  wrap.appendChild(allTab);

  state.categories.forEach(cat=>{
    const tab = document.createElement('div');
    tab.className = 'cat-tab' + (state.activeCategory === cat.id ? ' active' : '');
    tab.textContent = cat.name;
    tab.addEventListener('click', ()=>{ state.activeCategory = cat.id; renderCategoryTabs(); renderTasks(); });
    wrap.appendChild(tab);
  });

  const addTab = document.createElement('div');
  addTab.className = 'cat-tab add-tab';
  addTab.textContent = '+ New';
  addTab.addEventListener('click', ()=>{
    document.getElementById('newCategoryInput').value = '';
    document.getElementById('categoryModal').classList.add('active');
  });
  wrap.appendChild(addTab);
}
document.getElementById('cancelCategoryBtn').addEventListener('click', ()=> document.getElementById('categoryModal').classList.remove('active'));
document.getElementById('saveCategoryBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('newCategoryInput').value.trim();
  if(!name) return;
  const color = document.getElementById('newCategoryColor').value;
  const cat = {id: uid(), name, color};
  await dbPut('categories', cat);
  state.categories.push(cat);
  document.getElementById('categoryModal').classList.remove('active');
  renderCategoryTabs();
  populateCategorySelect();
});
function populateCategorySelect(){
  const sel = document.getElementById('taskCategorySelect');
  sel.innerHTML = '';
  state.categories.forEach(cat=>{
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = cat.name;
    sel.appendChild(opt);
  });
}

/* ============================================================
   Tasks
============================================================ */
function categoryFor(id){ return state.categories.find(c=> c.id === id); }

function renderTasks(){
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  let tasks = state.tasks;
  if(state.activeCategory !== 'all') tasks = tasks.filter(t=> t.categoryId === state.activeCategory);
  tasks = tasks.slice().sort((a,b)=> (a.claimed - b.claimed) || (b.createdAt - a.createdAt));

  if(tasks.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <b>No tasks here yet</b><span>Tap "Add Task" to create one, Sensei.</span>`;
    list.appendChild(empty);
    updateTasksBadge();
    return;
  }

  tasks.forEach(t=>{
    const cat = categoryFor(t.categoryId);
    const card = document.createElement('div');
    card.className = 'task-card' + (t.claimed ? ' claimed' : '');
    const pct = Math.min(100, Math.round((t.count / t.target) * 100));
    const canClaim = t.count >= t.target && !t.claimed;
    card.innerHTML = `
      <div class="task-top">
        <span class="task-tag tag-${cat ? cat.color : 'custom'}">${cat ? cat.name : 'Task'}</span>
        <span class="task-title">${escapeHtml(t.title)}</span>
        <div class="task-del" data-id="${t.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
      </div>
      <div class="task-bottom">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-count">${t.count}/${t.target}</div>
        ${t.claimed
          ? `<button class="task-action-btn claimed" disabled>Claimed</button>`
          : canClaim
            ? `<button class="task-action-btn claim" data-claim="${t.id}">Claim</button>`
            : `<button class="task-action-btn progress" data-progress="${t.id}">+1</button>`
        }
      </div>
      <div class="task-reward">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>
        <span>${t.reward} on claim</span>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('[data-progress]').forEach(btn=>{
    btn.addEventListener('click', ()=> bumpTask(btn.dataset.progress));
  });
  list.querySelectorAll('[data-claim]').forEach(btn=>{
    btn.addEventListener('click', ()=> claimTask(btn.dataset.claim));
  });
  list.querySelectorAll('.task-del').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteTask(btn.dataset.id));
  });
  updateTasksBadge();
}
function updateTasksBadge(){
  const claimable = state.tasks.some(t=> t.count >= t.target && !t.claimed);
  document.getElementById('tasksBadge').style.display = claimable ? 'block' : 'none';
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
async function bumpTask(id){
  const t = state.tasks.find(x=> x.id === id);
  if(!t) return;
  t.count = Math.min(t.target, t.count + 1);
  await dbPut('tasks', t);
  renderTasks();
}
async function claimTask(id){
  const t = state.tasks.find(x=> x.id === id);
  if(!t || t.claimed) return;
  t.claimed = true;
  await dbPut('tasks', t);
  await addCurrency(t.reward);
  renderTasks();
  showToast(`+${t.reward} claimed!`);
}
async function deleteTask(id){
  await dbDelete('tasks', id);
  state.tasks = state.tasks.filter(t=> t.id !== id);
  renderTasks();
}

/* Add/edit task modal */
document.getElementById('addTaskFab').addEventListener('click', ()=>{
  document.getElementById('taskModalTitle').textContent = 'Add Task';
  document.getElementById('taskTitleInput').value = '';
  document.getElementById('taskTargetInput').value = 1;
  document.getElementById('taskRewardInput').value = 10;
  if(state.activeCategory !== 'all'){
    document.getElementById('taskCategorySelect').value = state.activeCategory;
  }
  document.getElementById('taskModal').classList.add('active');
});
document.getElementById('cancelTaskBtn').addEventListener('click', ()=> document.getElementById('taskModal').classList.remove('active'));
document.getElementById('saveTaskBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('taskTitleInput').value.trim();
  if(!title) return;
  const categoryId = document.getElementById('taskCategorySelect').value;
  const target = Math.max(1, parseInt(document.getElementById('taskTargetInput').value) || 1);
  const reward = Math.max(0, parseInt(document.getElementById('taskRewardInput').value) || 0);
  const task = {id: uid(), title, categoryId, target, reward, count:0, claimed:false, createdAt: Date.now()};
  await dbPut('tasks', task);
  state.tasks.push(task);
  document.getElementById('taskModal').classList.remove('active');
  renderTasks();
});

/* Close modals on overlay click */
document.querySelectorAll('.modal-overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{ if(e.target === ov) ov.classList.remove('active'); });
});

boot();
</script>
</body>
</html>
